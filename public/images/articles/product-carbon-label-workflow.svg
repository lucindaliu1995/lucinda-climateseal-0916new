<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Product carbon label workflow</title>
  <desc id="desc">A simplified workflow from product and supply-chain data to carbon label disclosure and product improvement.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .panel { fill: #ffffff; stroke: #d7ddd6; stroke-width: 2; }
      .box { fill: #f4f0e8; stroke: #b7c5bc; stroke-width: 1.5; }
      .accent { fill: #123f3d; }
      .muted { fill: #5f7672; }
      .num { fill: #0f6a63; font: 700 18px Arial, sans-serif; }
      .label { fill: #123f3d; font: 700 22px Arial, sans-serif; }
      .small { fill: #5f7672; font: 500 16px Arial, sans-serif; }
      .arrow { stroke: #0f6a63; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 8 8; }
      .title { fill: #123f3d; font: 700 34px Arial, sans-serif; }
      .subtitle { fill: #5f7672; font: 500 18px Arial, sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f6a63"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="520" rx="28"/>
  <rect class="panel" x="36" y="36" width="1128" height="448" rx="24"/>

  <text class="title" x="600" y="88" text-anchor="middle">How a Carbon Label Is Built</text>
  <text class="subtitle" x="600" y="120" text-anchor="middle">From product data to reviewed disclosure and reduction planning</text>

  <g transform="translate(72 172)">
    <rect class="box" x="0" y="0" width="152" height="116" rx="18"/>
    <text class="num" x="22" y="34">01</text>
    <text class="label" x="22" y="66">Product</text>
    <text class="label" x="22" y="94">data</text>
  </g>
  <g transform="translate(248 172)">
    <rect class="box" x="0" y="0" width="152" height="116" rx="18"/>
    <text class="num" x="22" y="34">02</text>
    <text class="label" x="22" y="66">Footprint</text>
    <text class="label" x="22" y="94">calculation</text>
  </g>
  <g transform="translate(424 172)">
    <rect class="box" x="0" y="0" width="152" height="116" rx="18"/>
    <text class="num" x="22" y="34">03</text>
    <text class="label" x="22" y="66">Boundary</text>
    <text class="label" x="22" y="94">review</text>
  </g>
  <g transform="translate(600 172)">
    <rect class="box" x="0" y="0" width="152" height="116" rx="18"/>
    <text class="num" x="22" y="34">04</text>
    <text class="label" x="22" y="66">Verification</text>
    <text class="label" x="22" y="94">or assurance</text>
  </g>
  <g transform="translate(776 172)">
    <rect class="box" x="0" y="0" width="152" height="116" rx="18"/>
    <text class="num" x="22" y="34">05</text>
    <text class="label" x="22" y="66">Label or</text>
    <text class="label" x="22" y="94">QR disclosure</text>
  </g>
  <g transform="translate(952 172)">
    <rect class="box" x="0" y="0" width="152" height="116" rx="18"/>
    <text class="num" x="22" y="34">06</text>
    <text class="label" x="22" y="66">Buyer or</text>
    <text class="label" x="22" y="94">regulator</text>
  </g>

  <path class="arrow" d="M224 230 H246"/>
  <path class="arrow" d="M400 230 H422"/>
  <path class="arrow" d="M576 230 H598"/>
  <path class="arrow" d="M752 230 H774"/>
  <path class="arrow" d="M928 230 H950"/>

  <g transform="translate(248 344)">
    <rect class="box" x="0" y="0" width="300" height="82" rx="18"/>
    <text class="label" x="24" y="34">Emission hotspot analysis</text>
    <text class="small" x="24" y="60">Find what drives the footprint</text>
  </g>
  <g transform="translate(652 344)">
    <rect class="box" x="0" y="0" width="300" height="82" rx="18"/>
    <text class="label" x="24" y="34">Reduction planning</text>
    <text class="small" x="24" y="60">Improve product and supply-chain data</text>
  </g>

  <path class="arrow dashed" d="M324 288 V340"/>
  <path class="arrow" d="M548 385 H650"/>
  <path class="arrow dashed" d="M952 385 C1060 385 1088 310 1088 288"/>
</svg>
